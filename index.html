

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movix - Gestão Ferroviária Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style/style.css">
</head>
<body>
    <section class="Principal">
        <div class="container">
            <div class="row align-items-center min-vh-100">

                <div class="col-lg-6">

                    <img
                        src="assets/imgs/logo_movix_semfundoazul.png"
                        class="hero-logo mb-4"
                        alt="Logo Movix">

                    <h1 class="Texto-P">
                        Gestão ferroviária
                    </h1>

                    <p class="hero-description mt-4">
                        O Movix é uma plataforma desenvolvida para monitorar,
                        gerenciar e controlar operações ferroviárias em tempo
                        real, oferecendo maior segurança, eficiência e tomada
                        de decisão baseada em dados.
                    </p>
                    <form action="dashboard.php" method="POST" class="mt-4">
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                E-mail
                            </label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="Digite seu e-mail"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">
                                Senha
                            </label>
                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                class="form-control"
                                placeholder="Digite sua senha"
                                required>
                        </div>
                        <a href="public/dashboard.html">
                            Entrar
                        </a>
                    </form>
                    <p class="mt-3 text-center">
                        Não tem uma conta?
                        <a href="public/cadastro.html">
                            Criar conta
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
